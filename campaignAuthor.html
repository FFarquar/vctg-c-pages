<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VCTG-C — Campaign Author</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@400;500&family=Spectral:wght@500;700&family=Cormorant+Garamond:wght@600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <style>
      #root { display: flex; flex-direction: column; height: 100vh; }

      .sa-banner { background: var(--color-danger); color: var(--color-bg); padding: 6px 12px; font-size: 12px; }
      .sa-banner:empty { display: none; }

      .sa-navbar { display: flex; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--color-divider); }

      .sa-tabbar { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--color-divider); }

      /* Sub-tab row (a group's tabs — e.g. Campaign Scenarios' Campaign
         Settings/Map/OB) — indented and slightly smaller so it reads as
         nested under the top-level bar above it. */
      .sa-subtabbar { padding-left: 24px; }
      .sa-subtab { font-size: 12px; padding: 4px 12px; }

      .sa-pane { flex: 1; overflow: auto; padding: 14px; }

      .sa-section { border: 1px solid var(--color-divider); border-radius: 4px; padding: 10px 12px; margin-bottom: 14px; }
      .sa-section > h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; opacity: .7; }

      .sa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 10px; }
      .sa-field { display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
      .sa-field > label { opacity: .7; }
      .sa-field input[type="checkbox"] { width: 16px; height: 16px; align-self: flex-start; }

      /* Read-only sum readout (e.g. weather profile's per-month totals) sat inside an
         .sa-field in place of an input. Flagged when a month has no weight at all. */
      .sa-total-value { font-variant-numeric: tabular-nums; }
      .sa-total-value.sa-total-zero { color: var(--color-danger); }

      /* Controls carrying a hover/focus tooltip (see src/campaignAuthor/tooltip.ts). */
      [data-sa-tip] { cursor: help; }
      [data-sa-tip] input, [data-sa-tip] select { cursor: auto; }
      .sa-field[data-sa-tip] > label { text-decoration: underline dotted var(--color-divider); text-underline-offset: 2px; }
      .sa-tooltip {
        position: fixed; z-index: 1000; max-width: 280px; pointer-events: none;
        background: var(--color-neutral-900); color: #f5f5f8; border: 1px solid var(--color-divider); border-radius: 4px;
        padding: 6px 8px; font-size: 11.5px; line-height: 1.35;
        box-shadow: var(--shadow-md);
      }
      /* Atlas's neutral scale is inverted (neutral-900 is its lightest cream,
         not a dark surface like the other eras), so the tooltip's white text
         needs to flip to black to stay readable against it. */
      [data-theme="atlas"] .sa-tooltip { color: #1a1408; }

      .sa-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }

      /* Multi-select trait picker (formHelpers.ts multiSelectField) — a wrapping
         row of toggle chips, one per option, inside an .sa-field. */
      .sa-chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .sa-chip {
        font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; user-select: none;
        border: 1px solid var(--color-divider); background: var(--color-neutral-100); color: inherit; opacity: .75;
      }
      .sa-chip:hover { opacity: 1; }
      .sa-chip.sa-chip-on { background: var(--color-accent, var(--color-neutral-900)); color: var(--color-bg); opacity: 1; border-color: transparent; }
      .sa-chips-empty { font-size: 11px; opacity: .5; }

      .sa-array-item { border: 1px dashed var(--color-divider); border-radius: 4px; padding: 8px; margin-bottom: 8px; position: relative; }

      /* A denser, full-grid-bordered table shape than the shared `.table`
         component (which relies on a real `<tbody>` for its row-hover rule —
         these tables are built as bare `<table><tr>…` with no `<thead>`/
         `<tbody>`, so `.table`'s `tbody tr:hover` selector wouldn't match).
         Same spreadsheet-like intent as CTG's own editor tables. */
      table.sa-table { border-collapse: collapse; width: 100%; font-size: 12px; }
      table.sa-table th, table.sa-table td { border: 1px solid var(--color-divider); padding: 4px 6px; text-align: left; }
      table.sa-table th { background: var(--color-neutral-100); opacity: .8; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
      table.sa-table th.sa-th-sort { cursor: pointer; user-select: none; white-space: nowrap; }
      table.sa-table th.sa-th-sort:hover { opacity: 1; }

      .sa-map-layout { display: flex; gap: 10px; height: calc(100vh - 90px); }
      .sa-map-canvas { flex: 1; background: var(--board-bg); border: 1px solid var(--color-divider); }
      .sa-map-side { width: 280px; overflow-y: auto; }
      .sa-coord-display { font-family: monospace; font-size: 12px; opacity: .8; margin: 0 0 10px; }
      /* Settlement name + type shown next to the hovered hex coordinate — 2pt
         larger than the monospace coordinate readout it trails. */
      .sa-coord-settlement { font-size: 14px; }
      .sa-import-grid { font-family: monospace; font-size: 11px; white-space: pre; min-height: 100px; resize: vertical; }

      /* Collapsible wrapper around the map tab's bulk-text importers. */
      .sa-rollup { margin-bottom: 14px; }
      .sa-rollup > summary {
        cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; opacity: .7;
        padding: 6px 0; user-select: none;
      }
      .sa-rollup[open] > summary { margin-bottom: 8px; }
      .sa-rollup > .sa-section:last-child { margin-bottom: 0; }

      /* "View OB" — read-only hierarchical roll-up, one per Army HQ
         (tabs/ob.ts renderObRollups). Each nested formation is indented
         under its parent (16px/level — keep in sync with obTreeIndentPx);
         every unit table uses the same fixed column widths and is pulled
         back to the roll-up's left edge so columns line up across the army. */
      .sa-obtree-node { padding-left: 16px; margin: 3px 0; }
      .sa-obtree-root { padding-left: 0; }
      .sa-obtree-formation { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 3px 0; }
      .sa-obtree-echelon { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; opacity: .55; }
      .sa-obtree-name { font-weight: 600; }
      .sa-obtree-cmdr { font-size: 12px; opacity: .8; }
      .sa-obtree-nocmdr { color: var(--color-caution); opacity: 1; }
      .sa-obtree-subleaders { font-size: 11px; opacity: .65; padding: 0 0 2px; }
      .sa-obtree-empty { font-size: 12px; opacity: .6; margin: 2px 0; }
      table.sa-obtree-units { table-layout: fixed; margin: 4px 0 8px; }
      table.sa-obtree-units th, table.sa-obtree-units td { overflow-wrap: anywhere; }

      /* Save-time playability check (src/campaignAuthor/csfReadiness.ts) —
         blockers in the danger colour, softer warnings below them. */
      .sa-check-heading { font-size: 12px; margin: 8px 0 2px; opacity: .8; }
      .sa-check-list { margin: 2px 0 6px; padding-left: 18px; font-size: 12px; }
      .sa-check-list li { margin: 2px 0; }
      .sa-check-blocker { color: var(--color-danger); }
      .sa-check-warning { color: var(--color-caution); }
      .sa-check-ok { font-size: 12px; margin: 4px 0; }

      /* Page-wide "working" cursor while an async button handler (Save,
         Delete, Import) is awaiting the server — toggled by formHelpers.ts
         button(). Covers descendants too so it shows over inputs/links. */
      body.sa-busy, body.sa-busy * { cursor: wait !important; }

      /* Confirmation line at the top of a freshly-created campaign's panel
         (tabs/campaign.ts) — a plain-language acknowledgement that the
         POST succeeded, kept until another campaign is loaded or started. */
      .sa-created {
        border: 1px solid var(--color-accent, var(--color-divider));
        border-radius: 4px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px;
      }
      .sa-created::before { content: "\2713\00a0"; font-weight: 700; }

      /* Formation command-assignment tree (tabs/campaign.ts
         renderAssignmentPanel) — one indented node per formation, Army HQ at
         depth 0, corps/divisions nested under their parent. */
      .sa-assign-warn { color: var(--color-caution); font-size: 12px; margin-bottom: 8px; }
      .sa-assign-side { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; margin: 10px 0 4px; }
      .sa-assign-node { margin: 2px 0; }
      .sa-assign-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 3px 0; }
      .sa-assign-echelon { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; opacity: .55; }
      .sa-assign-name { font-weight: 600; }
      .sa-assign-select { width: auto; min-width: 180px; }
      .sa-assign-note { font-size: 12px; opacity: .7; }
      .sa-assign-note-none { color: var(--color-caution); opacity: 1; }
      .sa-inline-check { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 8px; }
    </style>
    <script type="module" crossorigin src="./assets/campaignAuthor-GpWBM71U.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/prefs-C9C4hdlQ.js">
    <link rel="stylesheet" crossorigin href="./assets/prefs-NOCYG6t2.css">
  </head>
  <body>
    <div id="root" class="era-theme"></div>
  </body>
</html>
