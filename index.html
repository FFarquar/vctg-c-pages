<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VCTG-C</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@400;500&family=Spectral:wght@500;700&family=Cormorant+Garamond:wght@600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <style>
      #app { width: 100vw; height: 100vh; display: block; }

      /* -- login / picker screens -- */
      .screen-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
      .login-card { width: 360px; max-width: 100%; }
      .login-form { display: flex; flex-direction: column; gap: 10px; }
      .login-error { color: var(--color-danger); font-size: 12px; }
      .login-dev { margin-top: 16px; font-size: 12px; opacity: .6; }
      .login-dev summary { cursor: pointer; }

      /* -- nav-bar notification bell (Phase 4.8 sub-phase D.7) -- */
      .notif-wrap { position: relative; display: inline-flex; margin-left: 4px; }
      .notif-bell { display: inline-flex; align-items: center; background: none; border: none; color: inherit; cursor: pointer; padding: 2px; position: relative; }
      .notif-bell:hover { color: var(--color-accent); }
      .notif-badge { position: absolute; top: -4px; right: -5px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--color-danger); color: var(--color-bg); font-size: 9px; line-height: 14px; text-align: center; font-weight: 700; }
      .notif-dropdown { position: absolute; top: 100%; right: 0; margin-top: 6px; width: 280px; max-height: 340px; overflow-y: auto; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 4px; z-index: 20; font-size: 12px; }
      .notif-head { font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--color-divider); }
      .notif-empty { padding: 10px; opacity: .6; font-style: italic; }
      .notif-row { padding: 6px 10px; border-bottom: 1px solid var(--color-divider); border-left: 3px solid transparent; }
      .notif-row-success { border-left-color: var(--color-accent); }
      .notif-row-warning { border-left-color: var(--color-caution); }
      .notif-row-danger { border-left-color: var(--color-danger); }
      .picker-error { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

      /* -- campaign picker -- */
      .pick-card { width: 440px; }
      .pick-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
      .pick-identity { font-size: 12px; opacity: .6; }
      .pick-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .pick-btn { display: block; width: 100%; text-align: left; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 4px; padding: 8px 10px; cursor: pointer; color: inherit; font: inherit; }
      .pick-btn:hover { border-color: var(--color-accent); }
      .pick-main { display: flex; align-items: center; gap: 8px; }
      .pick-name { font-weight: 600; }
      .pick-badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--color-divider); opacity: .8; }
      .pick-badge-active { border-color: var(--color-accent); color: var(--color-accent); opacity: 1; }
      .pick-badge-setup { border-color: var(--color-caution); color: var(--color-caution); opacity: 1; }
      .pick-badge-completed { border-color: var(--color-danger); color: var(--color-danger); opacity: 1; }
      .pick-role { font-size: 12px; opacity: .7; margin-top: 3px; }
      .pick-note { font-size: 11px; color: var(--color-caution); padding: 2px 2px 0; }
      .pick-note:empty { display: none; }

      /* -- app shell (Phase 4.8 sub-phase B) --
         Vertical stack of collapsible chrome bars over a 3-column play grid,
         porting CTG's vertical-flex-stack/grid pattern with the same
         `:empty{display:none}` collapse convention. Column widths (`--log-w`)
         are set from JS (`map.ts`), not fixed here, since whether the
         dispatches log (Phase C) has content is game-state-dependent. */
      .play-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
      #nav-bar, #play-topbar, #phase-bar, #turn-ribbon, #play-log { flex: none; }
      #nav-bar:empty, #play-topbar:empty, #phase-bar:empty, #turn-ribbon:empty, #play-log:empty { display: none; }
      /* The browser's own `[hidden]{display:none}` UA rule is attribute-only
         specificity — it loses to `#play-log`'s own `display: flex` below (an
         id selector outranks a bare attribute one). `map.ts`'s
         `setLogCollapsed` toggles the `hidden` attribute to collapse the log,
         so this needs its own id-scoped rule to actually win. */
      #play-log[hidden] { display: none; }
      #play-topbar { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-4); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--color-divider); }
      .topbar-meter { width: 180px; }
      /* Explicit `grid-column` line assignments, not DOM-order auto-placement:
         `#play-log:empty{display:none}` above removes it from the grid's
         *auto-placed* item list entirely when there's nothing in it yet
         (Phase C), which would otherwise shift `#board-col`/`#play-inspector`
         left by one track. Pinning each to its own line keeps them fixed
         regardless of whether the log column is present. */
      #play-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--log-w, 0px) 1fr var(--insp-w, 320px); }
      #play-log { grid-column: 1; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--color-divider); background: var(--color-surface); }
      #board-col { grid-column: 2; position: relative; min-width: 0; overflow: hidden; background: var(--board-bg, #1b1b1b); }
      #play-inspector { grid-column: 3; overflow-y: auto; border-left: 1px solid var(--color-divider); background: var(--color-surface); padding: var(--space-3); font-size: 12px; }

      /* -- dispatches log (Phase 4.8 sub-phase C), `dispatchLog.ts`'s
         `createDispatchLogPanel`. 3-part panel (header/chips fixed, body
         scrolls, footer fixed) ported from CTG's `combatLog.ts` shell. -- */
      /* Pinned just inside #board-col's own (clipped, `overflow:hidden`) box
         rather than hung outside it via a negative transform — that clipped
         instead of showing through #play-log underneath. */
      .log-toggle {
        position: absolute; left: 0; top: 50%; transform: translateY(-50%);
        z-index: 2; width: 16px; height: 44px; display: flex; align-items: center; justify-content: center;
        background: var(--color-surface); border: 1px solid var(--color-divider); border-left: none;
        border-radius: 0; color: var(--color-text); cursor: pointer; font-size: 13px; padding: 0;
      }
      .log-header { padding: var(--space-3) var(--space-3) 0; }
      .log-header h3 { margin: 0; font-family: var(--font-heading); font-size: 14px; }
      .log-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-divider); }
      .log-chip { font-size: 11px; padding: 3px 9px; border-radius: 10px; border: 1px solid var(--color-divider); background: transparent; color: var(--color-text); opacity: .65; cursor: pointer; }
      .log-chip-active { opacity: 1; background: var(--color-accent-100); border-color: var(--color-accent); color: var(--color-accent-800); }
      .log-highlight-mine { display: flex; align-items: center; gap: 4px; font-size: 11px; margin-left: auto; opacity: .8; }
      .log-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-2) var(--space-3); }
      .log-turn-group + .log-turn-group { margin-top: var(--space-2); }
      .log-turn-banner { position: sticky; top: 0; z-index: 1; background: var(--color-surface); font: 700 10px var(--font-heading); letter-spacing: .06em; text-transform: uppercase; text-align: center; opacity: .7; padding: 3px 0; }
      .log-row { display: flex; gap: 6px; padding: 4px 2px; font-size: 12px; border-bottom: 1px solid rgba(0, 0, 0, .06); }
      .log-row-clickable { cursor: pointer; }
      .log-row-clickable:hover { background: var(--color-neutral-100); }
      .log-row-kind { flex: none; font-weight: 700; opacity: .6; font-size: 10px; text-transform: uppercase; letter-spacing: .03em; padding-top: 1px; }
      .log-row-text { flex: 1; }
      .log-footer { padding: var(--space-2) var(--space-3); }

      /* phase bar (design handoff PHASES table, ported from CTG's battleTimeBar.ts) */
      .phase-labels { display: flex; gap: 2px; margin-bottom: 3px; }
      .phase-label { flex: 1 1 0%; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; text-align: center; font-family: var(--font-heading); font-weight: 700; opacity: .55; }
      .phase-label-current { opacity: 1; color: var(--color-accent); }
      .phase-label-done { opacity: .8; }
      .phase-bar-track { position: relative; display: flex; height: 14px; border: 1px solid var(--color-divider); }
      .phase-seg { border-right: 1px solid var(--color-bg); }
      .phase-seg:last-child { border-right: none; }
      .phase-seg-done { background: var(--color-accent-800); }
      .phase-seg-current { background: var(--color-accent); }
      .phase-seg-upcoming { background: var(--color-neutral-300); }
      .phase-marker { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; background: #fff; mix-blend-mode: difference; }
      .phase-marker-urgent { background: var(--color-danger); mix-blend-mode: normal; }
      .phase-chip { display: inline-block; margin-top: 4px; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 8px; background: var(--color-neutral-100); color: var(--color-text); }
      .phase-chip-urgent { background: var(--color-danger); color: #fff; }
      .phase-chip-closed { opacity: .5; }

      /* turn ribbon (design handoff RIB table, ported from CTG's turnOrderRibbon.ts) */
      #turn-ribbon { display: flex; gap: 2px; padding: 4px var(--space-4); border-bottom: 1px solid var(--color-divider); }
      .ribbon-step { font: 600 11px var(--font-heading); padding: 3px 9px; border: none; background: transparent; color: var(--color-text); white-space: nowrap; cursor: default; opacity: .55; }
      .ribbon-step-done { opacity: .85; }
      .ribbon-step-current { opacity: 1; background: var(--color-accent); color: var(--color-bg); font-weight: 700; }
      .ribbon-step-automatic { opacity: .7; background: var(--color-neutral-100); }
      .ribbon-step-clickable { cursor: pointer; }
      .ribbon-step-clickable:hover { text-decoration: underline; }
      .ribbon-step:disabled { cursor: default; }

      /* -- map screen -- */
      .map-canvas { position: absolute; inset: 0; }
      .map-acting-wrap { display: inline-flex; gap: 6px; align-items: center; opacity: .8; }
      .map-acting-as { background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-divider); border-radius: var(--radius-sm); padding: 2px 4px; font: inherit; }
      .map-banners { position: absolute; left: 50%; transform: translateX(-50%); top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
      .map-banner { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-radius: 4px; font-size: 12px; }
      .map-banner-info { background: var(--board-chrome-bg); border: 1px solid var(--board-chrome-border); color: var(--board-chrome-text); }
      .map-banner-error { background: var(--color-danger); border: 1px solid var(--color-danger); color: var(--color-bg); }

      /* -- inspector (Part B; relocated into #play-inspector, sub-phase B) -- */
      .insp-tabs { display: flex; margin: calc(var(--space-3) * -1) calc(var(--space-3) * -1) var(--space-2); border-bottom: 1px solid var(--color-divider); }
      .insp-pane { font-size: 12px; }
      .insp-breadcrumb { margin-bottom: 8px; font-size: 12px; }
      .insp-oob-list { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      .insp-oob-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent; border: 1px solid var(--color-divider); border-radius: 3px; padding: 6px 8px; cursor: pointer; color: inherit; font: inherit; }
      .insp-oob-row:hover { background: var(--color-neutral-100); }
      .insp-oob-name { flex: 1; }
      .insp-oob-echelon { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; opacity: .6; }
      .insp-oob-chevron { opacity: .5; }
      .insp-placeholder { margin: 0; opacity: .6; }
      .insp-head { margin-bottom: 8px; }
      .insp-rel { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 5px; border: 1px solid var(--color-divider); border-radius: 8px; opacity: .8; }
      .insp-rel-commanded { border-color: var(--color-accent); color: var(--color-accent); opacity: 1; }
      .insp-rel-ocTarget { border-color: var(--color-accent-400); color: var(--color-accent-400); opacity: 1; }
      .insp-rel-friendly { border-color: var(--color-divider); opacity: .8; }
      .insp-rel-enemy { border-color: var(--color-danger); color: var(--color-danger); opacity: 1; }
      .insp-pill-row { margin-bottom: 8px; }
      .insp-pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--color-divider); }
      .insp-pill-free { border-color: var(--color-accent); color: var(--color-accent); }
      .insp-pill-locked { border-color: var(--color-caution); color: var(--color-caution); }
      .insp-field { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; border-bottom: 1px solid var(--color-divider); }
      .insp-field-label { opacity: .6; }
      .insp-note { margin: 8px 0 0; opacity: .6; font-style: italic; font-size: 11px; }
      .insp-strength { margin-top: 6px; }
      .insp-units { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      .insp-unit { display: flex; gap: 8px; align-items: baseline; font-size: 11px; padding: 1px 0; }
      .insp-unit-name { flex: 1; }
      .insp-unit-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--color-caution); border: 1px solid var(--color-caution); border-radius: 6px; padding: 0 4px; }
      .insp-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
      .insp-multi { list-style: none; margin: 6px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
      .insp-multi-btn { display: block; width: 100%; text-align: left; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 3px; padding: 5px 8px; cursor: pointer; color: inherit; font: inherit; }
      .insp-multi-btn:hover { border-color: var(--color-accent); }
      .insp-clear { display: inline-block; margin-top: 10px; }

      .map-popover { position: absolute; left: 12px; bottom: 12px; z-index: 6; }
      .map-popover[hidden] { display: none; }
      .map-popover-card { width: 300px; max-height: 70vh; overflow-y: auto; background: var(--board-chrome-bg); border: 1px solid var(--board-chrome-border); color: var(--board-chrome-text); border-radius: 4px; padding: 12px; font-size: 12px; }
      .map-popover-head { font-weight: 600; margin-bottom: 6px; }

      /* -- map HUD chrome (Phase 4.8 sub-phase D.6) -- */
      .map-hud { position: absolute; z-index: 6; background: var(--board-chrome-bg); border: 1px solid var(--board-chrome-border); border-radius: 4px; color: var(--board-chrome-text); font-size: 11px; }
      .map-hud-zoom { right: 12px; bottom: 12px; display: flex; flex-direction: column; padding: 3px; gap: 3px; }
      .map-hud-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .08); border: 1px solid var(--board-chrome-border); border-radius: 3px; color: inherit; font-size: 15px; line-height: 1; cursor: pointer; }
      .map-hud-btn:hover { background: rgba(255, 255, 255, .18); }
      .map-hud-layers { right: 12px; top: 12px; display: flex; flex-direction: column; gap: 3px; padding: 7px 9px; }
      .map-hud-layer { display: flex; align-items: center; gap: 5px; cursor: pointer; }
      .map-hud-legend { left: 12px; top: 12px; display: flex; flex-direction: column; gap: 2px; padding: 7px 9px; opacity: .9; }

      /* -- order popover / directive form (Part C) -- */
      .opop-body { display: flex; flex-direction: column; gap: 8px; }
      .opop-field { display: flex; flex-direction: column; gap: 3px; }
      .opop-field > label { opacity: .7; }
      .opop-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .opop-num { width: 64px; }
      .opop-note { margin: 2px 0 0; opacity: .6; font-style: italic; font-size: 11px; }
      .opop-error { margin: 6px 0 0; color: var(--color-danger); font-size: 12px; }
      .opop-route-readout { color: var(--color-accent); }
      .opop-unit-list { display: flex; flex-direction: column; gap: 3px; max-height: 140px; overflow-y: auto; border: 1px solid var(--board-chrome-border); border-radius: 3px; padding: 4px 6px; }
      .opop-unit { display: flex; gap: 6px; align-items: center; }
      .opop-confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--color-caution); border: 1px solid var(--color-caution); color: var(--color-neutral-900); border-radius: 3px; padding: 6px 8px; margin-bottom: 8px; }
      .opop-actions { display: flex; gap: 10px; align-items: center; margin-top: 10px; }

      /* -- orders review panel (Phase 4.8 sub-phase D.1) -- */
      .orv-body { display: flex; flex-direction: column; gap: var(--space-2); }
      .orv-table-wrap { max-height: 60vh; overflow-y: auto; }
      .orv-order-cell { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .orv-forage { width: 64px; }
      .orv-actions-cell { text-align: right; white-space: nowrap; }

      /* -- battle flow panel (Phase 4.8 sub-phase D.2) -- */
      .bfl-body { display: flex; flex-direction: column; gap: var(--space-3); max-height: 70vh; overflow-y: auto; }
      .bfl-card { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; }
      .bfl-card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .bfl-card-title { font-weight: 600; }
      .bfl-owner-actions { display: flex; gap: var(--space-2); }
      .bfl-posture { display: flex; flex-direction: column; gap: 4px; }
      .bfl-posture-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .bfl-result-form { display: flex; flex-direction: column; gap: var(--space-2); }
      .bfl-stands { width: 64px; }
      .bfl-result-readout { color: var(--color-accent); font-size: 12px; }
      .bfl-result-list { margin: 4px 0 0; padding-left: 18px; }

      /* -- comms & intel panel (Phase 4.8 sub-phase D.3) -- */
      .cmi-body { display: flex; flex-direction: column; gap: var(--space-2); max-height: 70vh; overflow-y: auto; }
      .cmi-heading { margin: var(--space-2) 0 0; font-size: 13px; }
      .cmi-heading:first-child { margin-top: 0; }
      .cmi-list { display: flex; flex-direction: column; }
      .cmi-row { padding: 6px 2px; border-bottom: 1px solid rgba(0, 0, 0, .06); font-size: 12px; }
      .cmi-row:hover { background: var(--color-neutral-100); }
      .cmi-row-main { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .cmi-row-name { font-weight: 600; }
      .cmi-row-sub { margin-top: 2px; opacity: .6; }
      .cmi-row-turn { flex: none; font-weight: 700; opacity: .6; font-size: 10px; }

      /* -- supply/siege/victory readouts panel (Phase 4.8 sub-phase D.4) -- */
      .rdo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--space-3); max-height: 70vh; overflow-y: auto; }
      .rdo-card { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
      .rdo-card-title { margin: 0; font-size: 13px; }
      .rdo-siege { display: flex; flex-direction: column; gap: 3px; padding: 4px 0; border-top: 1px solid rgba(0, 0, 0, .06); }
      .rdo-siege:first-of-type { border-top: none; }
      .rdo-siege-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; }
      .rdo-victory-end { margin: 2px 0 0; font-size: 12px; font-weight: 600; }
      .rdo-obj-list { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
      .rdo-obj { display: flex; align-items: baseline; gap: 5px; font-size: 12px; }

      /* -- turn report modal (Phase 4.8 sub-phase D.5) -- */
      .trp-body { display: flex; flex-direction: column; gap: var(--space-2); max-height: 70vh; overflow-y: auto; }
      .trp-mine-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      .trp-group { display: flex; flex-direction: column; gap: 2px; }
      .trp-group-head { font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .03em; opacity: .6; margin-top: 4px; }
      .trp-row { font-size: 12px; padding: 2px 0; border-bottom: 1px solid rgba(0, 0, 0, .06); }

      .map-route-hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 7; background: var(--board-chrome-bg); border: 1px solid var(--board-chrome-border); color: var(--board-chrome-text); padding: 6px 12px; border-radius: 4px; font-size: 12px; }
      .map-route-hint[hidden] { display: none; }
    </style>
    <script type="module" crossorigin src="./assets/main-C4GGxIKU.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/prefs-BVKnlx4Z.js">
    <link rel="stylesheet" crossorigin href="./assets/prefs-NOCYG6t2.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
